version: '3.8'

services:
  mongodb:
    image: mongo:6.0-alpine
    container_name: job-tracker-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: job-tracker
      # For local development only - use proper credentials in production
      # MONGO_INITDB_ROOT_USERNAME: root
      # MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodb_data:/data/db
    networks:
      - job-tracker-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: job-tracker-backend
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/job-tracker
      SESSION_SECRET: ${SESSION_SECRET:-your-secret-key-change-in-production}
      FRONTEND_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: http://localhost:5000/api/auth/google/callback
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - job-tracker-network
    volumes:
      - ./backend:/app/backend
      - /app/backend/node_modules
    restart: unless-stopped

  frontend:
    image: node:18-alpine
    container_name: job-tracker-frontend
    working_dir: /app/frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:5000/api
      REACT_APP_APP_NAME: Smart Job Tracker
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    command: npm start
    depends_on:
      - backend
    networks:
      - job-tracker-network
    restart: unless-stopped

volumes:
  mongodb_data:
    driver: local

networks:
  job-tracker-network:
    driver: bridge
